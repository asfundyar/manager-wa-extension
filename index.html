<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Invoice Sender</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.1);
      padding: 30px 32px 36px;
      max-width: 520px;
      width: 100%;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .card-header h2 {
      font-size: 22px;
      font-weight: 600;
      color: #1a2634;
    }
    .badge {
      margin-left: auto;
      font-size: 12px;
      font-weight: 600;
      color: #25D366;
      background: #e6f9ee;
      padding: 4px 12px;
      border-radius: 100px;
    }
    .desc {
      color: #4a5a6e;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .wa-btn {
      background-color: #25D366;
      color: #fff;
      font-weight: 600;
      font-size: 16px;
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(37,211,102,0.30);
    }
    .wa-btn:hover:not(:disabled) {
      background-color: #1da851;
      box-shadow: 0 6px 18px rgba(37,211,102,0.40);
      transform: translateY(-1px);
    }
    .wa-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    .wa-btn .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      margin-top: 18px;
      font-size: 14px;
      text-align: center;
      padding: 8px 12px;
      border-radius: 10px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: transparent;
      color: #4a5a6e;
    }
    .status.error { background: #fef0ef; color: #b3362b; }
    .status.success { background: #e6f9ee; color: #1a7a3e; }
    .status.info { background: #eef3f9; color: #1f4b7a; }
    .meta {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #e9edf2;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #7a8a9e;
      flex-wrap: wrap;
    }
    .meta .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #25D366;
      margin-right: 4px;
    }
    .meta .dot.inactive { background: #cbd5e1; }
    @media (max-width: 480px) {
      .card { padding: 24px 20px 28px; }
      .card-header h2 { font-size: 19px; }
    }
  </style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
      <path d="M12.012 2C6.506 2 2.023 6.478 2.022 11.984c0 1.762.459 3.48 1.333 5.001l-1.416 5.171 5.291-1.387c1.467.8 3.117 1.222 4.78 1.223h.004c5.505 0 9.988-4.478 9.989-9.985 0-2.667-1.037-5.176-2.925-7.062C17.1 3.039 14.59 2.001 11.923 2h.089z" fill="#25D366"/>
      <path d="M17.2 14.3c-.3-.15-1.7-.85-2-.95-.3-.1-.5-.15-.7.15-.2.3-.8.95-1 1.15-.2.2-.4.25-.7.1-.3-.15-1.3-.5-2.5-1.55-.9-.8-1.5-1.8-1.7-2.1-.2-.3-.02-.45.15-.6.15-.15.35-.4.5-.6.15-.2.2-.35.3-.6.1-.25.05-.45-.02-.65-.07-.2-.7-1.65-.95-2.25-.25-.6-.5-.5-.7-.5-.2 0-.4-.05-.6-.05-.2 0-.55.1-.85.45-.3.35-1.1 1.1-1.1 2.65s1.15 3.1 1.3 3.3c.15.2 2.25 3.45 5.45 4.65 2.55.95 3.3.8 3.9.75.6-.05 1.9-.75 2.15-1.5.25-.75.25-1.4.15-1.55-.1-.15-.3-.25-.6-.4z" fill="#fff"/>
    </svg>
    <h2>WhatsApp Send</h2>
    <span class="badge">Manager.io</span>
  </div>
  <p class="desc">
    <strong>Auto‑detects</strong> invoice &amp; customer from the page. Click to send a complete summary via WhatsApp.
  </p>
  <button class="wa-btn" id="sendBtn">
    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
      <path d="M12.012 2c-5.506 0-9.989 4.478-9.99 9.984 0 1.762.459 3.48 1.333 5.001l-1.416 5.171 5.291-1.387c1.467.8 3.117 1.222 4.78 1.223h.004c5.505 0 9.988-4.478 9.989-9.985 0-2.667-1.037-5.176-2.925-7.062-1.887-1.886-4.398-2.924-7.066-2.925zm0 1.992c4.408 0 7.99 3.582 7.991 7.99 0 2.135-.83 4.141-2.339 5.651-1.509 1.509-3.516 2.34-5.652 2.34h-.003c-1.42 0-2.812-.37-4.032-1.071l-.289-.167-2.992.784.798-2.918-.184-.294c-.77-1.228-1.178-2.648-1.178-4.102 0-4.408 3.582-7.99 7.99-7.99z"/>
    </svg>
    <span id="btnLabel">Send via WhatsApp</span>
  </button>
  <div class="status" id="status"><span id="statusText">🔵 Ready</span></div>
  <div class="meta">
    <span><span class="dot" id="statusDot"></span><span id="connectionStatus">Checking page…</span></span>
    <span id="invoiceRef">Invoice: —</span>
  </div>
</div>

<script>
(function() {
  'use strict';

  const sendBtn = document.getElementById('sendBtn');
  const btnLabel = document.getElementById('btnLabel');
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const statusDot = document.getElementById('statusDot');
  const connectionStatus = document.getElementById('connectionStatus');
  const invoiceRefEl = document.getElementById('invoiceRef');

  let isLoading = false;
  let extractedData = null;

  function setStatus(msg, type) {
    statusText.textContent = msg;
    statusEl.className = 'status';
    if (type) statusEl.classList.add(type);
  }

  function setLoading(loading) {
    isLoading = loading;
    sendBtn.disabled = loading;
    if (loading) {
      btnLabel.innerHTML = '<span class="spinner"></span> Loading…';
    } else {
      btnLabel.textContent = 'Send via WhatsApp';
    }
  }

  function updateMeta(phone, reference) {
    if (phone) {
      const clean = phone.replace(/[^0-9]/g, '');
      connectionStatus.textContent = `📱 ${clean.slice(0,4)}••••${clean.slice(-2)}`;
      statusDot.className = 'dot';
    } else {
      connectionStatus.textContent = '⚠️ No phone found';
      statusDot.className = 'dot inactive';
    }
    invoiceRefEl.textContent = reference ? `Invoice: #${reference}` : 'Invoice: —';
  }

  // ---------- SMART PAGE SCANNER (improved) ----------
  function scanPageForInvoiceData() {
    const data = {};

    // Get all text from the page as lines
    const bodyText = document.body.innerText || '';
    const lines = bodyText.split('\n').map(s => s.trim()).filter(Boolean);

    // Helper: find a value after a label (case-insensitive)
    function findValueAfterLabel(labels, lines, maxLines = 3) {
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const lower = line.toLowerCase();
        for (const label of labels) {
          if (lower.includes(label.toLowerCase())) {
            // Check if the same line contains a colon or separator
            const parts = line.split(/[:#]\s*/);
            if (parts.length > 1) {
              const candidate = parts.slice(1).join(' ').trim();
              if (candidate) return candidate;
            }
            // Otherwise look at next lines
            for (let j = 1; j <= maxLines; j++) {
              const nextLine = lines[i + j] || '';
              if (nextLine && nextLine.length > 1) {
                // If next line is not just numbers, it might be a name
                return nextLine.trim();
              }
            }
          }
        }
      }
      return null;
    }

    // 1. Phone number: look for labels like "Primary Contact #", "Contact #", "Phone", "Mobile", "Cell"
    let phone = null;
    const phoneLabels = ['primary contact #', 'primary contact', 'contact #', 'contact number', 'phone #', 'mobile #', 'cell #', 'phone', 'mobile', 'cell'];
    const phoneValue = findValueAfterLabel(phoneLabels, lines);
    if (phoneValue) {
      // Extract any number sequence from it (digits, spaces, dashes, plus)
      const phoneMatch = phoneValue.match(/([\+\d\s\-\(\)]{7,})/);
      if (phoneMatch) phone = phoneMatch[1].trim();
    }

    // If still not found, scan all lines with a generic phone regex
    if (!phone) {
      const phoneRegex = /(\+?\d{1,3}[\s\-]?)?\(?\d{3}\)?[\s\-]?\d{3}[\s\-]?\d{4,}/g;
      for (const line of lines) {
        const match = line.match(phoneRegex);
        if (match) {
          phone = match[0].trim();
          break;
        }
      }
    }

    // If still no phone, try to find any number that looks like a Pakistani phone (starting with 03)
    if (!phone) {
      const pkRegex = /\b03\d{9}\b/;
      for (const line of lines) {
        const match = line.match(pkRegex);
        if (match) {
          phone = match[0];
          break;
        }
      }
    }

    data.phone = phone || '';

    // 2. Customer Name: look for "Primary Contact Person", "Contact Person", "Customer", "Client"
    let name = null;
    const nameLabels = ['primary contact person', 'contact person', 'customer name', 'client name', 'bill to', 'ship to', 'name'];
    const nameValue = findValueAfterLabel(nameLabels, lines);
    if (nameValue) {
      // Clean up: remove "Mr.", "Ms." etc. if present, but we can keep them
      name = nameValue.replace(/^(mr|ms|mrs|dr)\.?\s*/i, '').trim();
    }

    if (!name) {
      // Fallback: take first line that looks like a name (2-4 words, no numbers)
      for (const line of lines) {
        const words = line.split(/\s+/);
        if (words.length >= 2 && words.length <= 5 && !/\d/.test(line) && line.length > 3) {
          name = line;
          break;
        }
      }
    }
    data.name = name || 'Valued Customer';

    // 3. Invoice Number: look for "Invoice #", "Ref", "Number"
    let invoiceNumber = null;
    const invLabels = ['invoice #', 'invoice number', 'ref #', 'reference #', 'number #'];
    const invValue = findValueAfterLabel(invLabels, lines);
    if (invValue) {
      const invMatch = invValue.match(/([A-Z0-9\-]+)/);
      if (invMatch) invoiceNumber = invMatch[1];
    }

    if (!invoiceNumber) {
      // Scan for patterns like INV-123, #123, etc.
      const patterns = [
        /(?:invoice|inv|ref|#)\s*([A-Z0-9\-]+)/i,
        /([A-Z]{2,4}[\-\s]?\d{4,})/,
        /(\d{5,})/
      ];
      for (const line of lines) {
        for (const pattern of patterns) {
          const match = line.match(pattern);
          if (match) {
            invoiceNumber = match[1].trim();
            break;
          }
        }
        if (invoiceNumber) break;
      }
    }
    if (!invoiceNumber) {
      const url = window.location.href;
      const pathMatch = url.match(/\/(\d{4,})/);
      if (pathMatch) invoiceNumber = pathMatch[1];
    }
    data.reference = invoiceNumber || 'N/A';

    // 4. Total: look for "Total", "Grand Total", "Amount"
    let total = null;
    const totalLabels = ['grand total', 'total amount', 'total', 'amount due', 'balance due'];
    const totalValue = findValueAfterLabel(totalLabels, lines);
    if (totalValue) {
      const totalMatch = totalValue.match(/[$€£]?\s*([\d,]+\.\d{2})/);
      if (totalMatch) total = parseFloat(totalMatch[1].replace(/,/g, ''));
    }
    if (total === null) {
      // Scan all text for currency pattern
      const currencyMatch = bodyText.match(/[$€£]\s*([\d,]+\.\d{2})/);
      if (currencyMatch) total = parseFloat(currencyMatch[1].replace(/,/g, ''));
    }
    data.total = total;

    // 5. Items: try to get from tables
    const items = [];
    const tables = document.querySelectorAll('table');
    for (const table of tables) {
      const rows = table.querySelectorAll('tbody tr');
      if (rows.length > 0) {
        for (const row of rows) {
          const cols = row.querySelectorAll('td');
          if (cols.length >= 2) {
            const desc = cols[0]?.textContent.trim() || '';
            const qty = cols[1]?.textContent.trim() || '';
            const price = cols[2]?.textContent.trim() || '';
            if (desc && desc.length > 1) {
              items.push({ description: desc, quantity: qty, price: price });
            }
          }
        }
        if (items.length > 0) break;
      }
    }
    data.items = items;

    return data;
  }

  // ---------- Try API first, fallback to scanner ----------
  async function fetchInvoiceData() {
    // First, try the API (multiple endpoints)
    const url = window.location.href;
    const urlObj = new URL(url);
    const search = urlObj.search;
    const origin = urlObj.origin;

    let invoiceId = null;
    const idParams = ['id', 'invoice', 'invoiceId', 'reference', 'ref', 'view'];
    for (const p of idParams) {
      if (search.includes(p + '=')) {
        invoiceId = new URLSearchParams(search).get(p);
        break;
      }
    }
    if (!invoiceId) {
      const pathParts = urlObj.pathname.split('/');
      for (const part of pathParts) {
        if (/^\d+$/.test(part)) { invoiceId = part; break; }
      }
    }

    const endpoints = [];
    if (invoiceId) {
      endpoints.push(`/api4/view-v1?id=${invoiceId}`);
      endpoints.push(`/api4/invoice/${invoiceId}`);
      endpoints.push(`/api/invoice/${invoiceId}`);
      endpoints.push(`/api4/view/${invoiceId}`);
      endpoints.push(`/api/view/${invoiceId}`);
    }
    endpoints.push(`/api4/view-v1${search}`);
    endpoints.push(`/api4/view-v1${window.parent?.location?.search || ''}`);

    const unique = [...new Set(endpoints)];

    for (const endpoint of unique) {
      try {
        const fullUrl = endpoint.startsWith('http') ? endpoint : origin + endpoint;
        const res = await fetch(fullUrl, {
          headers: { 'Accept': 'application/json' },
          signal: AbortSignal.timeout(3000)
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        if (json && typeof json === 'object') {
          return json;
        }
      } catch (_) { /* ignore */ }
    }

    // If API fails, use the scanner
    console.warn('API failed, falling back to page scanner');
    return scanPageForInvoiceData();
  }

  // ---------- Extract fields from data (with fallbacks) ----------
  function getPhone(data) {
    const candidates = [
      data?.recipient?.phone, data?.customer?.phone, data?.client?.phone,
      data?.phone, data?.mobile, data?.recipient?.mobile,
      data?.customer?.mobile, data?.client?.mobile,
      data?.billingAddress?.phone, data?.shippingAddress?.phone,
      data?.contact?.phone, data?.contact?.mobile,
      data?.phoneNumber, data?.telephone, data?.primaryContact?.phone,
      data?.primaryContact?.mobile
    ];
    for (const c of candidates) {
      if (c && typeof c === 'string' && c.trim()) return c.trim();
    }
    if (Array.isArray(data) && data.length > 0) {
      const first = data[0];
      for (const f of ['phone','mobile','contactPhone','phoneNumber']) {
        if (first[f]) return first[f];
      }
    }
    return data.phone || '';
  }

  function getName(data) {
    const candidates = [
      data?.recipient?.name, data?.customer?.name, data?.client?.name,
      data?.name, data?.recipient?.fullName, data?.customer?.fullName,
      data?.fullName, data?.recipient?.company, data?.customer?.company,
      data?.company, data?.customerName, data?.clientName,
      data?.primaryContact?.name, data?.contact?.name
    ];
    for (const c of candidates) {
      if (c && typeof c === 'string' && c.trim()) return c.trim();
    }
    if (Array.isArray(data) && data.length > 0) {
      const first = data[0];
      for (const f of ['name','fullName','company','customerName']) {
        if (first[f]) return first[f];
      }
    }
    return data.name || 'Valued Customer';
  }

  function getReference(data) {
    const candidates = [
      data?.reference, data?.invoiceNumber, data?.invoiceNo,
      data?.ref, data?.number, data?.id, data?.invoiceId,
      data?.documentNumber, data?.docNumber, data?.invoiceRef
    ];
    for (const c of candidates) {
      if (c !== undefined && c !== null && c.toString().trim()) {
        return c.toString().trim();
      }
    }
    if (Array.isArray(data) && data.length > 0) {
      const first = data[0];
      for (const f of ['reference','invoiceNumber','invoiceNo','ref','number','id']) {
        if (first[f]) return first[f].toString();
      }
    }
    return data.reference || 'N/A';
  }

  function getItems(data) {
    const candidates = [data?.items, data?.lineItems, data?.lines, data?.products, data?.invoiceItems];
    for (const c of candidates) {
      if (Array.isArray(c) && c.length > 0) return c;
    }
    return [];
  }

  function getTotal(data) {
    const candidates = [data?.total, data?.grandTotal, data?.amount, data?.invoiceTotal, data?.subtotal];
    for (const c of candidates) {
      if (c !== undefined && c !== null && !isNaN(parseFloat(c))) {
        return parseFloat(c);
      }
    }
    return data.total || null;
  }

  // ---------- Build WhatsApp message ----------
  function buildMessage(data, invoiceUrl) {
    const name = getName(data);
    const ref = getReference(data);
    const items = getItems(data);
    const total = getTotal(data);

    let msg = `Hello ${name},\n\n`;
    msg += `📄 *Invoice #${ref}*\n\n`;

    if (items.length > 0) {
      msg += `*Items:*\n`;
      const maxShow = 8;
      const shown = items.slice(0, maxShow);
      for (const item of shown) {
        const desc = item.description || item.name || item.product || 'Item';
        const qty = item.quantity || item.qty || 1;
        const price = item.price || item.unitPrice || item.amount || 0;
        const priceStr = typeof price === 'number' ? price.toFixed(2) : price;
        msg += `  • ${desc}  x${qty}  $${priceStr}\n`;
      }
      if (items.length > maxShow) {
        msg += `  … and ${items.length - maxShow} more item(s)\n`;
      }
      msg += '\n';
    }

    if (total !== null) {
      const totalStr = typeof total === 'number' ? total.toFixed(2) : total;
      msg += `💰 *Total:* $${totalStr}\n\n`;
    }

    msg += `🔗 View full invoice:\n${invoiceUrl}\n\n`;
    msg += `Thank you,\n*Vals Tracking (Pvt) Ltd*`;

    return msg;
  }

  // ---------- Main send function ----------
  async function sendToWhatsApp() {
    if (isLoading) return;

    setLoading(true);
    setStatus('⏳ Fetching invoice data…', 'info');

    try {
      const invoiceUrl = window.location.href;

      let data;
      try {
        data = await fetchInvoiceData();
        // Merge with scanner result if missing fields
        const scanned = scanPageForInvoiceData();
        if (!data.phone && scanned.phone) data.phone = scanned.phone;
        if (!data.reference && scanned.reference) data.reference = scanned.reference;
        if (!data.name && scanned.name) data.name = scanned.name;
        if (data.total === undefined && scanned.total !== undefined) data.total = scanned.total;
        if (!data.items || data.items.length === 0) data.items = scanned.items || [];
        extractedData = data;
      } catch (err) {
        console.warn('Fetch error:', err);
        if (extractedData) {
          data = extractedData;
          setStatus('⚠️ Using cached data (API failed)', 'info');
        } else {
          data = scanPageForInvoiceData();
          if (!data.phone && !data.reference) {
            throw new Error('Could not extract any invoice data from the page.');
          }
          setStatus('⚠️ Using page scan (API unavailable)', 'info');
        }
      }

      const phone = getPhone(data);
      if (!phone) {
        setStatus('❌ No phone number found on this page.', 'error');
        setLoading(false);
        return;
      }

      const cleanPhone = phone.replace(/[^0-9]/g, '');
      if (cleanPhone.length < 7) {
        setStatus('❌ Phone number seems invalid (min 7 digits).', 'error');
        setLoading(false);
        return;
      }

      const ref = getReference(data);
      updateMeta(phone, ref);

      const message = buildMessage(data, invoiceUrl);
      const waUrl = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;
      window.open(waUrl, '_blank');

      setStatus(`✅ WhatsApp opened for ${getName(data)} (${cleanPhone})`, 'success');
      setLoading(false);

    } catch (err) {
      console.error('Send error:', err);
      setStatus(`❌ ${err.message || 'Something went wrong.'}`, 'error');
      setLoading(false);
    }
  }

  // ---------- Auto-load on page start ----------
  async function autoLoad() {
    try {
      const data = await fetchInvoiceData();
      const scanned = scanPageForInvoiceData();
      if (!data.phone && scanned.phone) data.phone = scanned.phone;
      if (!data.reference && scanned.reference) data.reference = scanned.reference;
      if (!data.name && scanned.name) data.name = scanned.name;
      if (data.total === undefined && scanned.total !== undefined) data.total = scanned.total;
      if (!data.items || data.items.length === 0) data.items = scanned.items || [];
      extractedData = data;
      const phone = getPhone(data);
      const ref = getReference(data);
      updateMeta(phone, ref);
      setStatus('✅ Data loaded – ready to send', 'success');
    } catch (err) {
      console.warn('Auto-load failed:', err);
      const scanned = scanPageForInvoiceData();
      if (scanned.phone || scanned.reference) {
        extractedData = scanned;
        updateMeta(scanned.phone || '', scanned.reference || '');
        setStatus('📄 Data extracted from page – ready', 'success');
      } else {
        setStatus('ℹ️ Click "Send" to scan for invoice data.', 'info');
        connectionStatus.textContent = '🔍 Scan page for data';
        statusDot.className = 'dot inactive';
      }
    }
  }

  // ---------- Events ----------
  sendBtn.addEventListener('click', sendToWhatsApp);

  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      sendToWhatsApp();
    }
  });

  // Run
  autoLoad();

})();
</script>
</body>
</html>
